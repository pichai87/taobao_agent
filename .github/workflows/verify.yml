name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test and package
        run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Console logic regression tests
        run: node --test scripts/console.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'
