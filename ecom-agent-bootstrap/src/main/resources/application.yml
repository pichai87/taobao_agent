spring:
  application:
    name: ecom-data-analysis-agent
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false
agent:
  model:
    mode: ${AGENT_MODEL_MODE:offline}

