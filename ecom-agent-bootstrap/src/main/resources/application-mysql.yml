# 密码没有默认值；只建表，不装载合成数据。
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ecom_agent?useSSL=true&serverTimezone=UTC}
    username: ${MYSQL_APP_USER:agent_app}
    password: ${MYSQL_APP_PASSWORD}
agent:
  reader:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ecom_agent?useSSL=true&serverTimezone=UTC}
    username: ${MYSQL_READER_USER:agent_reader}
    password: ${MYSQL_READER_PASSWORD}
  auth:
    username: ${APP_USERNAME:analyst}
    password: ${APP_PASSWORD}

